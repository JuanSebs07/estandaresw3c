<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formulario de datos</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <header>
        <nav aria-label="Menú principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="juan.html">Gustos de Juan</a></li>
                <li><a href="Leandro.html">Gustos de Leandro</a></li>
                <li><a href="formulario.html" aria-current="page">Formulario</a></li>
                <li><a href="pag.html">Segunda página</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Formulario</h1>
        <form name="datos">
            <p>
                <label for="numero">Número</label>
                <input type="number" id="numero" name="numero">
            </p>
            <p>
                <label for="email">E-mail (obligatorio)</label>
                <input type="email" id="email" class="label" name="ema_user" placeholder="Ingrese su email" autocomplete="email" required aria-describedby="error-email">
                <span class="error" id="error-email"></span>
            </p>
            <p>
                <label for="nombres">Nombre (obligatorio)</label>
                <input type="text" id="nombres" class="label" name="name_user" placeholder="Ingrese sus Nombres" autocomplete="given-name" required aria-describedby="error-nombres">
                <span class="error" id="error-nombres"></span>
            </p>
            <p>
                <label for="apellidos">Apellido (obligatorio)</label>
                <input type="text" id="apellidos" class="label" name="ape_user" placeholder="Ingrese sus Apellidos" autocomplete="family-name" required aria-describedby="error-apellidos">
                <span class="error" id="error-apellidos"></span>
            </p>
            <p>
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha" autocomplete="bday">
            </p>
            <p>
                <label for="pagina">Página web</label>
                <input type="url" id="pagina" name="pagina" autocomplete="url">
            </p>
            <fieldset>
                <legend>¿Qué estándares conoces?</legend>
                <div class="opcion">
                    <input type="checkbox" id="html5" name="estandares" value="HTML5" checked>
                    <label for="html5">HTML5</label>
                </div>
                <div class="opcion">
                    <input type="checkbox" id="css3" name="estandares" value="CSS3">
                    <label for="css3">CSS3</label>
                </div>
                <div class="opcion">
                    <input type="checkbox" id="javascript" name="estandares" value="Javascript">
                    <label for="javascript">JavaScript</label>
                </div>
            </fieldset>
            <p>
                <label for="comentarios">Comentarios</label>
                <textarea id="comentarios" name="comentarios" cols="15" rows="6"></textarea>
            </p>
            <div class="botoncito_registrar">
                <button type="submit" id="bt" name="bt">Enviar la informacion</button>
            </div>
            <p id="mensaje-formulario" role="status"></p>
        </form>
        <h2>Integrantes</h2>
        <ul>
            <li>Genner Leandro Rivas Romero</li>
            <li>Juan Sebastian Ruiz Giler</li>
        </ul>
    </main>
    <footer>
        <p>Práctica de Desarrollo Basado en Plataformas</p>
    </footer>
    <script src="codigo.js"></script>
</body>
</html>
